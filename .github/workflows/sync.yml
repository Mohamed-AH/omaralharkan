name: Daily lessons sync

# Lists the channel, rebuilds data/catalog.json and feed.xml, and commits if anything changed.
# Cloudflare Pages redeploys on every push to main, so new lessons go live a minute later.
on:
  schedule:
    - cron: "0 19 * * *"   # 22:00 Riyadh time, after the evening lessons
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List the channel
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 -I tools/crawl.py
      - name: Read the Telegram channel
        run: python3 -I tools/telegram.py
      - name: Build the catalog and feed
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 -I tools/build_catalog.py
      - name: Copy new audio and PDFs to R2
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AUDIO_BASE_URL: ${{ vars.AUDIO_BASE_URL }}
        run: |
          if [ -n "$TG_API_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ]; then
            pip install -q telethon==1.36.0 boto3==1.35.36
          fi
          python3 -I tools/audio_sync.py
      - name: Add the copied files to the catalog
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 -I tools/build_catalog.py
      - name: Commit if anything changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data feed.xml feeds
          if git diff --cached --quiet; then echo "No new lessons"; exit 0; fi
          git commit -m "Add new lessons"
          git pull -q --rebase origin main
          git push
