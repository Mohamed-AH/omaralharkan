<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دروس الشيخ عمر بن حمد الحركان</title>
<meta name="description" content="شروح المتون العلمية لفضيلة الشيخ عمر بن حمد الحركان، مرتبة كتاباً كتاباً، مع الاستماع والمتابعة من حيث توقفت.">
<meta name="theme-color" content="#0F2A22">
<link rel="alternate" type="application/rss+xml" title="أحدث الدروس" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="sr" href="#main">تخطَّ إلى المحتوى</a>
<header class="star" id="top">
  <div class="wrap">
    <div class="top">
      <nav aria-label="الأقسام">
        <a class="brand" href="#/">الحركان</a>
        <a href="#/" data-nav="home">الشروح</a>
        <a href="#/book/khutbah" data-nav="khutbah">الخطب</a>
        <a href="#/book/yawm" data-nav="yawm">يوم من التاريخ</a>
        <a href="#/mine" data-nav="mine">ما أتابعه</a>
      </nav>
      <form class="search" role="search" id="searchForm">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E2C792" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="sr" for="q">بحث</label>
        <input id="q" type="search" placeholder="ابحث عن درس أو باب أو كتاب" autocomplete="off">
      </form>
    </div>
    <div id="heroSlot"></div>
  </div>
</header>
<main id="main" class="wrap" tabindex="-1"></main>
<footer class="wrap">
  <div>جميع الدروس من <a href="https://www.youtube.com/@omaralharkan" rel="noopener">القناة الرسمية للشيخ على يوتيوب</a>، وتُحدَّث يومياً · آخر تحديث: <span id="updated"></span> · <a href="feed.xml">تابع الجديد (RSS)</a></div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<div class="player" id="player" hidden>
  <div class="in">
    <div class="video"><div id="yt"></div></div>
    <button class="pp" id="pp" type="button" aria-label="تشغيل"></button>
    <button class="skip" id="back" type="button" aria-label="رجوع ١٥ ثانية">١٥−</button>
    <button class="skip" id="fwd" type="button" aria-label="تقدّم ٣٠ ثانية">+٣٠</button>
    <div class="now-t">
      <div><b id="nowT"></b> <span id="nowB"></span></div>
      <div class="seek"><span id="cur">٠:٠٠</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="موضع التشغيل"><span id="dur">٠:٠٠</span></div>
    </div>
    <button class="mode" id="speed" type="button" aria-label="سرعة التشغيل">١×</button>
    <button class="mode" id="mode" type="button" aria-pressed="false">عرض المرئي</button>
    <button class="skip" id="next" type="button" aria-label="الدرس التالي">التالي</button>
  </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
